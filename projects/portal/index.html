<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
  <div class="login-box">
    <h2>Login</h2>
    <form class="inputs">
      <div class="input-group"> <label>Username</label> <input type="text" placeholder="Enter username" required > </div>
      <div class="input-group"> <label>Password</label> <input type="password" placeholder="Enter password" >
      </div> <button type="submit" class="submit">Login</button>
    </form>
    <div class="mcontainer">

      <nav class="nav">
        <div class="w">
          <p class="welcome">Welcome,</p>
          <p class="user-name">Zain Nadeem!</p>
        </div>
        <div class="img-container"><img src="https://plus.unsplash.com/premium_photo-1661508620175-3ae20da61cda?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8YnVzc2luZXNzJTIwbWFufGVufDB8fDB8fHww" alt="image"></div>
      </nav>
      <section class="info-container">
        <div class="info" id="i1">
          <div class="icon"><i style="color: #3F87EC;" class="fa-solid fa-file-lines"></i></div>
          <p class="fixed" style="color: black;">Total Score: 50</p>
          <p class="tota-score"></p>
        </div>
        <div class="info" id="i2">
          <div class="icon"><i style="color: #4AAF9A;" class="fa-solid fa-check"></i></div>
          <p class="fixed">Average Marks: 24</p>
          <p class="tota-score"></p>
        </div>
        <div class="info" id="i3">
          <div class="icon"><i style="color: #E06B55;" class="fa-solid fa-circle-user"></i></div>
          <p class="fixed">highest Score: 45</p>
          <p class="tota-score"></p>
        </div>
        <div class="info" id="i4">
          <div class="icon"><i style="color: #F49838;" class="fa-solid fa-flag-usa"></i></div>
          <p class="fixed">lowest Score: 12</p>
          <p class="tota-score"></p>
        </div>
      </section>

      <a href="index.html">Dashboard</a>
      <section class="data-container">

        <!-- LEFT SIDE -->
        <div class="left">

          <!-- MULTI STEP FORM -->
          <div class="form-box">

            <div class="step active" id="step1">
              <h3>Step 1</h3>
              <input type="text" placeholder="Subject">
              <button>Next</button>
            </div>

            <div class="step" id="step2">
              <h3>Step 2</h3>
              <input type="number" placeholder="Marks">
              <button>Back</button>
              <button>Next</button>
            </div>

            <div class="step" id="step3">
              <h3>Review</h3>
              <p>Data preview here</p>
              <button>Back</button>
              <button>Submit</button>
            </div>

          </div>

          <!-- TABLE -->
          <div class="table-box">
            <h3>Entries</h3>
            <table>
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Marks</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Math</td>
                  <td>85</td>
                  <td>12/02/2022</td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right">

          <!-- GRAPH -->
          <div class="graph-box">
            <h3>Marks Distribution</h3>
            <div class="chart"></div>
          </div>

          <!-- FILTER -->
          <div class="filter-box">
            <h3>Filters</h3>

            <label>Date Range</label>
            <input type="date">
            <input type="date">

            <label>Score Range</label>
            <input type="range">

            <button>Apply</button>
          </div>

        </div>

      </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
